[package]
name = "cells-cli"
version = "0.1.0"
description = "cells, the command line: check, show, pin, run and query a folder of .cells files"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cells"
path = "src/main.rs"

[dependencies]
cells = { package = "cells-engine", path = "../cells" }
cells-daemon = { path = "../cells-daemon" }
notify = "8"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
tower-lsp = "0.20"
# DuckDB 2.0.0's C API, built from its bundled sources: `cells sql`. Only the C binding, never
# the `duckdb` crate's Rust layer, which adds arrow-rs and reads results through it.
libduckdb-sys = { version = "=1.20000.1", default-features = false, features = ["bundled", "capi-v1"] }
