[workspace]
resolver = "3"
members = ["cells", "cells-cli", "cells-daemon", "cells-disk", "cells-sql", "cells-wasm", "cells-ffi", "cells-bench"]
default-members = ["cells", "cells-cli", "cells-daemon", "cells-disk", "cells-sql", "cells-ffi"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/adriangalilea/cells"
rust-version = "1.89"

# A development build: a panic names its file and line, which is all the debug info is
# read for. Full debug info cost 9 GB of target/ on a Mac, where it stays in every object
# file beside its binary (unpacked), and most of it was DuckDB's C++ compiled with it.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# The Apple static libraries: release, no debug info. Build scripts and proc macros are
# never stripped (Xcode 27's strip corrupts the dylibs they load from).
[profile.apple]
inherits = "release"
debug = false
strip = "debuginfo"

[profile.apple.build-override]
strip = false

[profile.wasm]
inherits = "release"
opt-level = "z"
debug = false
strip = true
