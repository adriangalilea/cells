[workspace]
resolver = "3"
members = ["tcsv", "tcsv-cli", "tcsv-wasm", "tcsv-bench"]
default-members = ["tcsv", "tcsv-cli"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/adriangalilea/tcsv"
rust-version = "1.89"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
debug = "line-tables-only"

[profile.bench]
inherits = "release"

[profile.wasm]
inherits = "release"
opt-level = "z"
debug = false
strip = true
