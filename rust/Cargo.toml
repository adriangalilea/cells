[workspace]
resolver = "3"
members = ["cells", "cells-cli", "cells-wasm", "cells-ffi", "cells-bench"]
default-members = ["cells", "cells-cli", "cells-ffi"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/adriangalilea/cells"
rust-version = "1.89"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# The Apple static libraries: release, no debug info. Build scripts and proc macros are
# never stripped (Xcode 27's strip corrupts the dylibs they load from).
[profile.apple]
inherits = "release"
debug = false
strip = "debuginfo"

[profile.apple.build-override]
strip = false

[profile.wasm]
inherits = "release"
opt-level = "z"
debug = false
strip = true
