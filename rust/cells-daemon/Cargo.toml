[package]
name = "cells-daemon"
version = "0.1.0"
description = "The engine kept running over folders of .cells files: changes heard on the disk, every file they reach stored, every write logged"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# A library for `cells serve` and the language server, and a static one for the app that
# hosts the engine (`hosted.rs`, `build-apple.sh`).
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
cells = { package = "cells-engine", path = "../cells" }
# the trace's local time (localtime_r), the one call std does not make
libc = "0.2"
notify = "8"
# the socket's messages, typed (`wire`), and the log's lines
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# who connects, by code signature (`trust`): the Security framework's code-signing calls
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }
