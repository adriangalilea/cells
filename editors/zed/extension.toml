id = "cells"
name = "Cells"
description = "Cells, programmable data: highlighting and the cells language server"
version = "0.1.0"
schema_version = 1
authors = ["Adrian Galilea"]
repository = "https://github.com/adriangalilea/cells"

# The grammar this extension's queries are written for: `rev` is the last commit that
# changed the parser, written by tree-sitter/scripts/queries.ts; Zed fetches it from GitHub.
[grammars.cells]
repository = "https://github.com/adriangalilea/cells"
rev = "2f641c95650424d390ee05b8de35503a1aef30f5"
path = "tree-sitter"

[language_servers.cells]
name = "cells"
languages = ["Cells"]
